name: pace-probe

# HOW FAST MAY THIS TOOL ASK THE SEARCH INDEX? Measured from the runner, because that is where
# it will run, and answered nowhere else.
#
# WHAT IT IS LOOKING FOR. Asked for several different days in quick succession, the search
# endpoint answers the FIRST question over and over: identical rows, identical `@odata.count`,
# HTTP 200, and the filter it was given nowhere in the answer. Only the first request after an
# idle stretch is real. That is a rate limiter serving a stale response instead of a 429, and it
# is the most dangerous thing on this route -- a nightly walking a fortnight would deliver one
# day fourteen times and call it a catch-up. Measured from a workstation on 2026-09-07: stale at
# 2 s and at 15 s, honest at 20 s and above. The detail API does not do this and is honest at
# 1 s, which is what keeps a day of tenders cheap.
#
# The tool does not depend on this number for CORRECTNESS -- `fi_targets` checks that every row
# it was handed falls inside the window it asked for, and stops when one does not. This job
# decides how long a catch-up takes, not whether it is right.
#
# Six days, one gap, and the answer prints which day each response actually contained. Six
# matching days means the gap is safe; anything else names a gap that is not.

on:
  workflow_dispatch:
    inputs:
      gap:
        description: "Seconds between search requests"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  pace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8   # v5.0.0
      - name: Ask for six days, ${{ inputs.gap }}s apart
        run: python3 tools/pace_probe.py --gap "${{ inputs.gap }}"
